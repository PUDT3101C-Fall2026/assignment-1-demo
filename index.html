<!doctype html>
<html>
  <head>
    <title>Animals</title>
    <link href="style.css" rel="stylesheet" />
    <script>
      window.addEventListener("load", () => {
        // Grab a list of all of the animal image elements
        let animals = document.querySelectorAll(".animal");

        for (let i = 0; i < animals.length; ++i) {
          // Each animal should be clickable and should toggle its color
          let thisAnimal = animals[i];
          thisAnimal.addEventListener("click", () => {
            thisAnimal.classList.toggle("active");
          });
        }
      });
    </script>
  </head>
  <body>
    <h1>My Favorite Animals</h1>
    <h2>Mammals</h2>
    <p>
      This site is for me to remember all of the animals that I like. It's good
      to make lists for one's self.
    </p>
    <div class="container">
      <img
        id="cat"
        class="animal"
        width="200"
        src="https://upload.wikimedia.org/wikipedia/commons/6/68/Orange_tabby_cat_sitting_on_fallen_leaves-Hisashi-01A.jpg"
      />
      <img
        id="kangaroo"
        class="animal"
        width="200"
        src="https://upload.wikimedia.org/wikipedia/commons/d/df/Forester_kangaroo_%28Macropus_giganteus_tasmaniensis%29_juvenile_hopping_Esk_Valley.jpg"
      />
      <img
        id="armadillo"
        class="animal"
        width="200"
        src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Nine-banded_Armadillo.jpg"
      />
      <img
        id="fox"
        class="animal"
        width="200"
        src="https://upload.wikimedia.org/wikipedia/commons/3/30/Vulpes_vulpes_ssp_fulvus.jpg"
      />
    </div>
  </body>
</html>
