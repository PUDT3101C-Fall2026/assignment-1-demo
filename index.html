<!doctype html>
<html>
  <head>
    <title>Animals</title>
    <link href="style.css" rel="stylesheet" />
    <script>
      function shuffle(array) {
        let currentIndex = array.length;

        // While there remain elements to shuffle...
        while (currentIndex != 0) {
          // Pick a remaining element...
          let randomIndex = Math.floor(Math.random() * currentIndex);
          currentIndex--;

          // And swap it with the current element.
          [array[currentIndex], array[randomIndex]] = [
            array[randomIndex],
            array[currentIndex],
          ];
        }
      }

      // This function is called every time the window loads
      window.addEventListener("load", () => {
        // Grab a list of all of the animal image elements
        let animals = document.querySelectorAll(".animal");

        let slots = ["slot-0", "slot-1", "slot-2", "slot-3"];

        shuffle(slots);

        for (let i = 0; i < animals.length; ++i) {
          let animal = animals[i];
          animal.classList.add(slots[i]);
        }
      });
    </script>
  </head>
  <body>
    <h1>My Favorite Animals</h1>
    <h2>Mammals</h2>
    <p>
      This site is for me to remember all of the animals that I like. It's good
      to make lists for one's self.
    </p>
    <div class="container">
      <div class="animal">
        <p>Cat!</p>
        <img
          id="cat"
          width="200"
          src="https://upload.wikimedia.org/wikipedia/commons/6/68/Orange_tabby_cat_sitting_on_fallen_leaves-Hisashi-01A.jpg"
        />
      </div>
      <div class="animal">
        <p>Kangaroo!</p>
        <img
          id="kangaroo"
          width="200"
          src="https://upload.wikimedia.org/wikipedia/commons/d/df/Forester_kangaroo_%28Macropus_giganteus_tasmaniensis%29_juvenile_hopping_Esk_Valley.jpg"
        />
      </div>
      <div class="animal">
        <p>Armadillo!</p>
        <img
          id="armadillo"
          width="200"
          src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Nine-banded_Armadillo.jpg"
        />
      </div>
      <div class="animal">
        <p>Fox!</p>
        <img
          id="fox"
          width="200"
          src="https://upload.wikimedia.org/wikipedia/commons/3/30/Vulpes_vulpes_ssp_fulvus.jpg"
        />
      </div>
    </div>
  </body>
</html>
