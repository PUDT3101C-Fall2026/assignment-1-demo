<!doctype html>
<html>
  <head>
    <title>Animals</title>
    <style>
      body {
        margin: 0;
        background: #000;
        color: aliceblue;
      }

      h1 {
        border-bottom: solid;
        border-color: dodgerblue;
        color: dodgerblue;
      }

      p {
        margin: 25px 0;
      }

      .container {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
      }

      .container > div {
        background: rgb(117, 119, 128);
      }

      img {
        width: 100%;
        height: 100%;
      }

      #cat {
        grid-row: 1 / 3;
      }

      #kangaroo {
        grid-column: 2 / 4;
      }

      #armadillo {
        grid-column: 3;
        grid-row: 2;
      }

      #fox {
        grid-column: 2;
        grid-row: 2;
      }
    </style>
  </head>
  <body>
    <h1>My Favorite Animals</h1>
    <h2>Mammals</h2>
    <p>
      This site is for me to remember all of the animals that I like. It's good
      to make lists for one's self.
    </p>
    <div class="container">
      <img
        id="cat"
        class="animal_pic"
        width="200"
        src="https://upload.wikimedia.org/wikipedia/commons/6/68/Orange_tabby_cat_sitting_on_fallen_leaves-Hisashi-01A.jpg"
      />
      <img
        id="kangaroo"
        width="200"
        src="https://upload.wikimedia.org/wikipedia/commons/d/df/Forester_kangaroo_%28Macropus_giganteus_tasmaniensis%29_juvenile_hopping_Esk_Valley.jpg"
      />
      <img
        id="armadillo"
        width="200"
        src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Nine-banded_Armadillo.jpg"
      />
      <img
        id="fox"
        width="200"
        src="https://upload.wikimedia.org/wikipedia/commons/3/30/Vulpes_vulpes_ssp_fulvus.jpg"
      />
    </div>
  </body>
</html>
